# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish
on: [workflow_dispatch]

jobs:
  build:
    name: release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run compile
    - name: Get current package version
      id: package_version
      uses: martinbeentjes/npm-get-version-action@v1.3.1
    - name: Check version is mentioned in Changelog
      uses: mindsers/changelog-reader-action@v2.2.3
      with:
        version: ${{ steps.package_version.outputs.current-version }}
        path: 'CHANGELOG.md'
    - name: Create vsix and publish to marketplace
      id: create_vsix
      uses: HaaLeo/publish-vscode-extension@v2
      with:
        pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        registryUrl: https://marketplace.visualstudio.com
    - name: Create a Release and attach the vsix
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.package_version.outputs.current-version }}
        name: ${{ steps.package_version.outputs.current-version }}
        body: Publish ${{ steps.package_version.outputs.current-version }}
        files: ${{ steps.create_vsix.outputs.vsixPath }}
